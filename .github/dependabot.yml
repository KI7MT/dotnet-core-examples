# Only three projects carry NuGet packages, all of them in the Redis leaderboard.
# They are named explicitly: an earlier "/**/*" glob matched the same project
# through several paths and opened the same bump four times.
#
# Updates are grouped, so a round of version bumps arrives as one pull request
# per ecosystem rather than one per package per project.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/Database/RedisLeaderboard/LBClient"
      - "/Database/RedisLeaderboard/LBLibrary"
      - "/Database/RedisLeaderboard/LBService"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
